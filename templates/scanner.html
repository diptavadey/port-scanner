<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ShieldScan | Port Discovery</title>
</head>
<body class="bg-zinc-950 text-emerald-500 font-mono min-h-screen p-10">
    <div class="max-w-2xl mx-auto border border-emerald-900/30 p-8 rounded-2xl bg-zinc-900/50">
        <h1 class="text-2xl font-black mb-6 uppercase italic tracking-tighter">Port_Scanner_v1.0</h1>

        <form method="POST" class="space-y-4">
            <div class="flex flex-col gap-2">
                <label class="text-[10px] text-emerald-800 font-bold uppercase">Target IP Address</label>
                <input type="text" name="target" placeholder="127.0.0.1" required 
                       class="bg-black border border-emerald-900/50 rounded-lg p-4 text-emerald-400 focus:outline-none focus:ring-1 focus:ring-emerald-500 transition-all">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-black py-4 rounded-lg font-black hover:bg-emerald-400 transition-all uppercase tracking-widest">
                Initiate Port Probe
            </button>
        </form>

        {% if results is not none %}
        <div class="mt-10 animate-in fade-in duration-500">
            <h2 class="text-xs text-emerald-800 font-bold mb-4 uppercase">Scan Results for {{ target }}</h2>
            {% if results %}
                <div class="space-y-2">
                    {% for r in results %}
                    <div class="flex justify-between items-center p-3 bg-black/50 border border-emerald-900/20 rounded-lg">
                        <span class="font-bold text-lg">Port {{ r.port }}</span>
                        <span class="text-xs italic text-emerald-600">{{ r.service }}</span>
                        <span class="text-[10px] bg-emerald-900/40 px-2 py-1 rounded text-emerald-400 font-bold">OPEN</span>
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="p-8 text-center border border-dashed border-emerald-900/30 rounded-lg text-emerald-800 italic">
                    No open ports discovered in range 1-500.
                </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
